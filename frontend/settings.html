<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings â€” Lodestar</title>
  <meta name="description" content="Lodestar settings. Privacy controls and appearance preferences.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#443199">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="preload" href="../assets/fonts/raleway-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/head-theme.js"></script>
  <script src="js/head-lang.js"></script>
  <script src="js/sw-register.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body data-page="settings">
  <a class="skip-link" href="#main" data-i18n="skip.label">Skip to content</a>

  <header class="settings-header">
    <button class="settings-header__back" type="button" id="settings-back" data-i18n-aria="go.back">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <a class="settings-header__brand" href="index.html" aria-label="Lodestar â€” Home">
      <img class="settings-header__logo logo-word logo-word--purple" src="../assets/purple-logo.svg" alt="Lodestar" width="155" height="26">
      <img class="settings-header__logo logo-word logo-word--white" src="../assets/white-logo.svg" alt="Lodestar" width="155" height="26">
      <img class="settings-header__logo logo-mark" src="../assets/icon.svg" alt="Lodestar" width="26" height="26">
    </a>
  </header>

  <main id="main" class="settings" tabindex="-1">
    <h1 class="settings__title" data-i18n="settings.title">Settings</h1>

    <section class="settings__section" aria-labelledby="account-heading">
      <h2 id="account-heading" data-i18n="settings.account">Account</h2>
      <div class="account" id="account-panel"></div>
    </section>

    <section class="settings__section" aria-labelledby="privacy-heading">
      <h2 id="privacy-heading" data-i18n="settings.privacy">Privacy</h2>
      <fieldset class="settings__fieldset">
        <legend class="settings__legend" data-i18n="settings.searchHistory">Search history</legend>
        <div class="settings__options">
          <label class="settings__option">
            <input type="radio" name="history" value="off">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="5.7" y1="5.7" x2="18.3" y2="18.3"></line>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.history.off">Off</span>
              <span class="settings__option-desc" data-i18n="settings.history.off.desc">Don't keep any search history</span>
            </span>
          </label>
          <label class="settings__option">
            <input type="radio" name="history" value="24h" checked>
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 14"></polyline>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.history.24h">Delete after 24 hours</span>
              <span class="settings__option-desc" data-i18n="settings.history.24h.desc">Default â€” history is cleared automatically every day</span>
            </span>
          </label>
          <label class="settings__option">
            <input type="radio" name="history" value="always">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 1 0 0-8c-2 0-4 1.33-6 4Z"></path>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.history.always">Keep always</span>
              <span class="settings__option-desc" data-i18n="settings.history.always.desc">Keep search history on this device permanently</span>
            </span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="settings__section" aria-labelledby="appearance-heading">
      <h2 id="appearance-heading" data-i18n="settings.appearance">Appearance</h2>
      <fieldset class="settings__fieldset">
        <legend class="settings__legend" data-i18n="settings.theme">Theme</legend>
        <div class="settings__options">
          <label class="settings__option">
            <input type="radio" name="theme" value="light">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"></line>
                <line x1="17.7" y1="17.7" x2="19.1" y2="19.1"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"></line>
                <line x1="17.7" y1="6.3" x2="19.1" y2="4.9"></line>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.theme.light">Light</span>
              <span class="settings__option-desc" data-i18n="settings.theme.light.desc">Clean light interface</span>
            </span>
          </label>
          <label class="settings__option">
            <input type="radio" name="theme" value="dark">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.theme.dark">Dark</span>
              <span class="settings__option-desc" data-i18n="settings.theme.dark.desc">Low-light interface</span>
            </span>
          </label>
          <label class="settings__option">
            <input type="radio" name="theme" value="system" checked>
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.theme.system">System</span>
              <span class="settings__option-desc" data-i18n="settings.theme.system.desc">Follow your device setting</span>
            </span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="settings__section" aria-labelledby="search-heading">
      <h2 id="search-heading" data-i18n="settings.search">Search</h2>
      <fieldset class="settings__fieldset">
        <legend class="settings__legend" data-i18n="settings.suggestions">Search suggestions</legend>
        <div class="settings__options">
          <label class="settings__option">
            <input type="radio" name="suggestions" value="on">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"></path>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.suggestions.on">On</span>
              <span class="settings__option-desc" data-i18n="settings.suggestions.on.desc">Suggest queries and show recent searches while typing</span>
            </span>
          </label>
          <label class="settings__option">
            <input type="radio" name="suggestions" value="off">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="5.7" y1="5.7" x2="18.3" y2="18.3"></line>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.suggestions.off">Off</span>
              <span class="settings__option-desc" data-i18n="settings.suggestions.off.desc">No suggestions or recent-search dropdown</span>
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset class="settings__fieldset">
        <legend class="settings__legend" data-i18n="settings.safeSearch">Safe search</legend>
        <div class="settings__options">
          <label class="settings__option">
            <input type="radio" name="safesearch" value="off" checked>
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="5.7" y1="5.7" x2="18.3" y2="18.3"></line>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.history.off">Off</span>
              <span class="settings__option-desc" data-i18n="settings.safesearch.off.desc">Show all results</span>
            </span>
          </label>
          <label class="settings__option">
            <input type="radio" name="safesearch" value="on">
            <span class="settings__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 4 5v6c0 5.25 3.4 10.15 8 11 4.6-.85 8-5.75 8-11V5l-8-3Z"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </span>
            <span class="settings__option-text">
              <span class="settings__option-name" data-i18n="settings.suggestions.on">On</span>
              <span class="settings__option-desc" data-i18n="settings.safesearch.on.desc">Filter explicit content from results</span>
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset class="settings__fieldset">
        <legend class="settings__legend" data-i18n="settings.language">Language</legend>
        <p class="settings__hint" data-i18n="settings.language.desc">Changes the language of the whole interface.</p>
        <label class="sr-only" for="lang-select" data-i18n="settings.language">Language</label>
        <select class="settings__select" id="lang-select"></select>
      </fieldset>
    </section>

    <div class="settings-save" id="settings-save-bar" role="status" aria-live="polite">
      <p class="settings-save__label" id="settings-save-label" data-i18n="settings.unsaved">You have unsaved changes</p>
      <button class="btn btn--primary" id="settings-save" type="button" data-i18n="settings.save">Save changes</button>
    </div>
  </main>

  <footer class="page-footer">
    <a href="index.html" data-i18n="back.to.search">Back to search</a>
    <span aria-hidden="true">Â·</span>
    <span data-i18n="settings.footer">Preferences are stored only on this device</span>
  </footer>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/settings.js"></script>
</body>
</html>
