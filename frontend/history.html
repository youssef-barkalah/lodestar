<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History — Lodestar</title>
  <meta name="description" content="Your search history on Lodestar.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/raleway-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/head-theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="settings-header">
    <button class="settings-header__back" type="button" id="history-back" aria-label="Go back">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <a class="settings-header__brand" href="index.html" aria-label="Lodestar — Home">
      <img class="settings-header__logo logo-word logo-word--purple" src="assets/purple-logo.svg" alt="Lodestar" width="155" height="26">
      <img class="settings-header__logo logo-word logo-word--white" src="assets/white-logo.svg" alt="Lodestar" width="155" height="26">
      <img class="settings-header__logo logo-mark" src="assets/icon.svg" alt="Lodestar" width="26" height="26">
    </a>
  </header>

  <main id="main" class="settings" tabindex="-1">
    <h1 class="settings__title">History</h1>

    <div class="history__bar">
      <p class="history__count" id="history-count"></p>
      <button class="btn history__clear" type="button" id="history-clear">Clear history</button>
    </div>

    <ul class="history__list" id="history-list"></ul>

    <div class="empty" id="history-empty" hidden>
      <h2 class="empty__title" id="history-empty-title"></h2>
      <p class="empty__text">Searches you make will appear here.</p>
    </div>
  </main>

  <footer class="page-footer">
    <a href="index.html">Back to search</a>
    <span aria-hidden="true">·</span>
    <span>History is stored only on this device</span>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/history-page.js"></script>
</body>
</html>
