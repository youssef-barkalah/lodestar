<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found â€” Lodestar</title>
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#443199">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="preload" href="../assets/fonts/raleway-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/head-theme.js"></script>
  <script src="js/head-lang.js"></script>
  <script src="js/sw-register.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .notfound__code {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      color: var(--brand);
    }

    .notfound__text {
      margin: 18px 0 26px;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .notfound__search {
      width: min(480px, 100%);
      margin-top: 6px;
    }
  </style>
</head>
<body data-page="404">
  <main class="notfound" id="main" tabindex="-1">
    <p class="notfound__code">404</p>
    <p class="notfound__text" data-i18n="error404.text">The page you're looking for doesn't exist or has moved.</p>
    <form class="search-form notfound__search" action="search.html" method="get" role="search">
      <label class="sr-only" for="nf-q" data-i18n="search.label">Search the web</label>
      <div class="search-box">
        <input class="search-box__input" id="nf-q" name="q" type="search" placeholder="Search the web" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button class="search-box__submit" type="submit" data-i18n-aria="search.action">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </form>
    <p class="notfound__text">
      <a href="index.html" data-i18n="error404.home">Go to Lodestar home</a>
    </p>
  </main>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
